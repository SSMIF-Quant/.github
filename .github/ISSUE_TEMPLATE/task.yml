name: Task
description: A standardized unit of work a lead hands off for an analyst to claim.
title: "[Task]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome and why it matters — leave the "how" to whoever picks this up.
        Leave this issue **unassigned** so it's available to claim from the team board.

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      description: How time-sensitive this is.
      options:
        - "Low"
        - "Medium"
        - "High"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome is wanted, not how to build it.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What this feeds into (a report, another team's model, a live dashboard).
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done looks like
      description: Concrete, checkable criteria.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Optional — anything else worth flagging (context, links, an obvious wrong turn to avoid).
    validations:
      required: false
